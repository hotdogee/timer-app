name: Deploy

# Manual: Actions › Deploy › Run workflow, on main only. Needs two secrets, as repository secrets
# or (better) secrets of the `production` environment, which can require an approval:
# CLOUDFLARE_API_TOKEN (a token with the "Edit Cloudflare Workers" permissions plus D1 edit) and
# CLOUDFLARE_ACCOUNT_ID. Only the two steps that talk to Cloudflare see them; installing, testing
# and building run without. The Worker's own secrets (BETTER_AUTH_SECRET, BETTER_AUTH_URL, mailer,
# OAuth) are set once with `wrangler secret put`; see docs/deploy.md. Actions are pinned to commits
# (the tag each had when pinned is in the comment).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build and deploy the Worker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:server

      # The Worker serves dist/ as its static assets.
      - run: pnpm build

      # Apply new D1 migrations before the code that needs them goes live.
      - run: pnpm server:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm server:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
