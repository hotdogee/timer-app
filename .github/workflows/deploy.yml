name: Deploy

# Manual (Actions › Deploy › Run workflow) or started by the release workflow, on main only. Needs
# two secrets, as repository secrets or (better) secrets of the `production` environment, which
# can require an approval: CLOUDFLARE_API_TOKEN (a token with the "Edit Cloudflare Workers"
# permissions plus D1 edit) and CLOUDFLARE_ACCOUNT_ID. Only the two steps that talk to Cloudflare
# see them; installing, testing and building run without. The Worker's own secrets
# (BETTER_AUTH_SECRET, BETTER_AUTH_URL, mailer, OAuth) are set once with `wrangler secret put`; see
# docs/deploy.md. Actions are pinned to commits (the tag each had when pinned is in the comment).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to deploy (vX.Y.Z, a commit on main); empty deploys the head of main
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build and deploy the Worker
    if: github.ref == 'refs/heads/main'
    # Pinned image (never -latest), so an image migration cannot change a deploy under us.
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      # A release tag (the release workflow passes its own), or else the commit this run is on.
      - name: Choose the commit
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ref=refs/tags/$REF" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ref $REF is not a release tag (vX.Y.Z); leave it empty to deploy main"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}
          # The whole history, to check that the tag's commit is on main.
          fetch-depth: ${{ inputs.ref == '' && 1 || 0 }}
          persist-credentials: false

      - name: Check the tag is on main
        if: inputs.ref != ''
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse --short HEAD) is not on main: deploy release tags from main only"
            exit 1
          fi
          echo "Deploying $(git describe --tags --exact-match HEAD) ($(git rev-parse --short HEAD))"

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:server

      # The Worker serves dist/ as its static assets.
      - run: pnpm build

      # Apply new D1 migrations before the code that needs them goes live.
      - run: pnpm server:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm server:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
