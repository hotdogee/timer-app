name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check, lint, test, build, e2e
    # Pinned images (never -latest), so an image migration cannot change CI under us.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # package.json, tauri.conf.json, Cargo.toml and Cargo.lock agree on the version.
      - run: pnpm version:check
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      # Worker integration tests in workerd (local D1 and Durable Objects; no Cloudflare account).
      - run: pnpm test:server
      - run: pnpm build

      # End-to-end tests run against the production build, served with the API by wrangler dev
      # (E2E_SERVER=preview, the CI default; see playwright.config.ts).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # Traces of failed tests, plus screenshots saved for review (not pixel-asserted).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Desktop shell (Rust, Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No web build: a plain cargo build of the shell is a development build (no `custom-protocol`
      # feature), which serves the page from the dev server and never reads dist/. M6's
      # `tauri build` builds the web app first.
      # Pinned to the stable branch's commit: that fixes the action's code; rustup still installs
      # the newest stable Rust (`toolchain`).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # cargo-audit, prebuilt: RustSec advisories fail the job (accepted ones, with their reasons,
      # are in src-tauri/.cargo/audit.toml).
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The release profile too: it leaves out the debug-only smoke hook (module, command, grant).
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test
      - run: cargo audit
