name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      # Worker integration tests in workerd (local D1 and Durable Objects; no Cloudflare account).
      - run: pnpm test:server
      - run: pnpm build

      # End-to-end tests run against the production build, served with the API by wrangler dev
      # (E2E_SERVER=preview, the CI default; see playwright.config.ts).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      # Traces of failed tests, plus screenshots saved for review (not pixel-asserted).
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
