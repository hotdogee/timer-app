name: Feature request
description: An idea or an improvement for Timer App.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation or the problem, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How could it work?
      description: Keys, settings or screens you imagine. Timer App is keyboard first, so say how it would work from the keyboard too.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
