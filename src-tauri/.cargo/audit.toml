# cargo audit (CI › rust job): vulnerability advisories accepted for now, each with its reason.
# Warnings (unmaintained or unsound crates, today all Linux-only) do not fail the job.

[advisories]
ignore = [
  # zip 4.6.1, used only by tauri-plugin-updater 2.14.0 (the latest 2.x, which requires zip ^4;
  # fixed in zip >= 9.0.0): Unix permissions and symbolic links in an extracted archive. The
  # updater extracts an update only after its minisign signature has been verified against the
  # app's public key, and this build has no key yet (updates are off until M6). Revisit when
  # tauri-plugin-updater moves to zip >= 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
