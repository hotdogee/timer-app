[package]
name = "timer-app"
version = "0.0.0"
description = "Timer App desktop shell"
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix keeps the library's output name distinct from the binary's,
# avoiding a filename collision on Windows (rust-lang/cargo#8519).
name = "timer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
